<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>HUNNU — Admin Booking</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&family=Oswald:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0d;--card:#16151a;--paper:#ede9e1;--muted:#8a8790;--red:#a31621;--gold:#b08d3f;--line:#2c2a2e;--green:#3da56a}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:Inter,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.login{min-height:100dvh;display:grid;place-items:center;padding:24px}.login-card,.panel{background:var(--card);border:1px solid var(--line);border-radius:22px}.login-card{width:min(420px,100%);padding:32px}.brand{font:700 24px Oswald,sans-serif;text-transform:uppercase}.brand span{color:var(--red)}.eyebrow{font:10px JetBrains Mono,monospace;color:var(--gold);letter-spacing:.16em;margin-bottom:10px}.muted{color:var(--muted);font-size:13px;line-height:1.6}.field{margin-top:17px}.field label{display:block;color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:7px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:12px;background:#101014;color:var(--paper);padding:12px 13px;outline:0}.field textarea{min-height:72px;resize:vertical}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold)}.btn{border:0;border-radius:12px;padding:12px 16px;background:var(--red);color:white;font-weight:700;cursor:pointer}.btn.full{width:100%;margin-top:18px}.btn.secondary{background:#242329}.btn.danger{background:transparent;border:1px solid rgba(163,22,33,.7);color:#e78289}.error{color:#e78289;font-size:12px;margin-top:10px}.app{max-width:1180px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}.top-actions{display:flex;gap:8px}.layout{display:grid;grid-template-columns:380px 1fr;gap:18px}.panel{padding:20px;min-width:0}.panel h2{font:700 21px Oswald,sans-serif;text-transform:uppercase;margin:0 0 14px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}.span2{grid-column:1/-1}.toolbar{display:flex;gap:10px;align-items:end;margin-bottom:16px}.toolbar .field{margin:0;flex:1}.booking-list{display:flex;flex-direction:column;gap:10px}.booking{border:1px solid var(--line);border-radius:15px;padding:14px;background:#111115}.booking-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.booking-time{font:700 18px JetBrains Mono,monospace;color:var(--gold)}.badge{font-size:10px;border-radius:999px;padding:5px 8px;background:#29282d;color:var(--muted)}.booking-name{font-weight:700;margin:7px 0 4px}.booking-meta{font-size:12px;color:var(--muted);line-height:1.7}.booking-actions{display:flex;gap:8px;margin-top:10px}.booking-actions .btn{padding:8px 11px;font-size:11px}.day-head{font:700 13px JetBrains Mono,monospace;color:var(--paper);padding:12px 2px 4px}.empty{text-align:center;padding:46px 10px;color:var(--muted)}.notice{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--paper);color:var(--bg);padding:12px 18px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:10;font-size:13px}.notice.show{opacity:1;transform:translate(-50%,0)}@media(max-width:840px){.app{padding:16px}.layout{grid-template-columns:1fr}.panel{padding:16px}.top{align-items:flex-start}.brand{font-size:20px}}@media(max-width:480px){.form-grid{grid-template-columns:1fr}.span2{grid-column:auto}.toolbar{align-items:stretch;flex-direction:column}.top-actions .btn{padding:9px 11px;font-size:11px}.booking-head{gap:8px}}
</style>
</head><body>
<section class="login" id="loginView"><div class="login-card"><div class="eyebrow">PRIVATE ACCESS</div><div class="brand">HUNNU <span>ADMIN</span></div><p class="muted">Зөвхөн studio-ийн эрхтэй ажилтанд зориулсан цагийн удирдлага.</p><form onsubmit="login(event)"><div class="field"><label>Admin нууц код</label><input id="tokenInput" type="password" autocomplete="current-password" required></div><button class="btn full">Нэвтрэх</button><div class="error" id="loginError"></div></form></div></section>
<main class="app hidden" id="appView"><header class="top"><div><div class="eyebrow">BOOKING CONTROL</div><div class="brand">HUNNU <span>ADMIN</span></div></div><div class="top-actions"><button class="btn secondary" onclick="loadBookings()">Шинэчлэх</button><button class="btn secondary" onclick="logout()">Гарах</button></div></header>
<div class="layout"><section class="panel"><h2 id="formTitle">Цаг гараар нэмэх</h2><form id="bookingForm" onsubmit="saveBooking(event)"><input type="hidden" id="bookingId"><div class="form-grid">
<div class="field"><label>Artist</label><select id="artist" required><option value="ml">Mnhja Loco</option><option value="a2">Jamuh</option><option value="a3">Gerlee</option><option value="a4">LILI</option><option value="a5">Zuugii</option><option value="a6">Caos</option><option value="a7">Zulka</option></select></div>
<div class="field"><label>Үйлчилгээ</label><select id="service"><option value="tattoo">Шивээс</option><option value="piercing">Piercing</option><option value="removal">Лазер арилгалт</option><option value="course">Сургалт</option></select></div>
<div class="field"><label>Өдөр</label><input type="date" id="date" required></div><div class="field"><label>Цаг</label><select id="time" required></select></div>
<div class="field"><label>Үйлчлүүлэгчийн нэр</label><input id="customerName" placeholder="Нэр"></div><div class="field"><label>Утас</label><input id="customerPhone" type="tel" placeholder="99112233"></div>
<div class="field span2"><label>Тэмдэглэл</label><textarea id="note" placeholder="Нэмэлт мэдээлэл..."></textarea></div></div><button class="btn full" id="saveBtn">Цаг хадгалах</button><button type="button" class="btn secondary full hidden" id="cancelEdit" onclick="resetForm()">Засварыг болих</button><div class="error" id="formError"></div></form></section>
<section class="panel"><h2>Захиалгын хуваарь</h2><div class="toolbar"><div class="field"><label>Эхлэх өдөр</label><input type="date" id="filterFrom"></div><div class="field"><label>Дуусах өдөр</label><input type="date" id="filterTo"></div><button class="btn" onclick="loadBookings()">Харах</button></div><div class="booking-list" id="bookingList"></div></section></div></main><div class="notice" id="notice"></div>
<script>
const API='https://hunnu-booking.ulamsainmunkhjargal.workers.dev/admin/api';let token=sessionStorage.getItem('hunnuAdminToken')||'';let bookings=[];
const names={ml:'Mnhja Loco',a2:'Jamuh',a3:'Gerlee',a4:'LILI',a5:'Zuugii',a6:'Caos',a7:'Zulka'};const services={tattoo:'Шивээс',piercing:'Piercing',removal:'Лазер арилгалт',course:'Сургалт'};
function localDate(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function setup(){for(let h=10;h<=22;h++){let o=document.createElement('option');o.value=String(h).padStart(2,'0')+':00';o.textContent=o.value;time.appendChild(o)}let now=new Date(),later=new Date();later.setDate(later.getDate()+30);date.value=localDate(now);filterFrom.value=localDate(now);filterTo.value=localDate(later);if(token)showApp()}
async function api(method='',body,url=API){let opts={method:method||'GET',headers:{Authorization:'Bearer '+token}};if(body){opts.headers['Content-Type']='application/json';opts.body=JSON.stringify(body)}let r=await fetch(url,opts),data=await r.json().catch(()=>({}));if(r.status===401){logout();throw Error('Нууц код буруу байна.')}if(!r.ok)throw Error(data.error||'Алдаа гарлаа');return data}
async function login(e){e.preventDefault();token=tokenInput.value.trim();loginError.textContent='';try{await api('GET',null,API+'?from='+localDate(new Date())+'&to='+localDate(new Date()));sessionStorage.setItem('hunnuAdminToken',token);showApp()}catch(err){loginError.textContent=err.message}}
function showApp(){loginView.classList.add('hidden');appView.classList.remove('hidden');loadBookings()}
function logout(){token='';sessionStorage.removeItem('hunnuAdminToken');appView.classList.add('hidden');loginView.classList.remove('hidden');tokenInput.value=''}
async function loadBookings(){bookingList.innerHTML='<div class="empty">Уншиж байна...</div>';try{let d=await api('GET',null,API+'?from='+filterFrom.value+'&to='+filterTo.value);bookings=d.bookings||[];render()}catch(e){bookingList.innerHTML='<div class="empty">'+esc(e.message)+'</div>'}}
function esc(v){return String(v||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(){if(!bookings.length){bookingList.innerHTML='<div class="empty">Энэ хугацаанд захиалга алга.</div>';return}let last='';bookingList.innerHTML=bookings.map(b=>{let head='';if(last!==b.booking_date){last=b.booking_date;head='<div class="day-head">📅 '+esc(last)+'</div>'}return head+'<article class="booking"><div class="booking-head"><div><div class="booking-time">'+esc(b.booking_time)+'</div><div class="booking-name">'+esc(b.customer_name||'Нэргүй')+'</div></div><span class="badge">'+esc(names[b.artist]||b.artist)+'</span></div><div class="booking-meta">'+esc(services[b.service]||b.service)+(b.customer_phone?' · '+esc(b.customer_phone):'')+'<br>'+esc(b.note||'')+'</div><div class="booking-actions"><button class="btn secondary" onclick="editBooking(\''+b.id+'\')">Засах</button><button class="btn danger" onclick="cancelBooking(\''+b.id+'\')">Цуцлах</button></div></article>'}).join('')}
async function saveBooking(e){e.preventDefault();formError.textContent='';let data={id:bookingId.value,artist:artist.value,service:service.value,booking_date:date.value,booking_time:time.value,customer_name:customerName.value.trim(),customer_phone:customerPhone.value.trim(),note:note.value.trim(),status:'confirmed'};try{await api(data.id?'PATCH':'POST',data);toast(data.id?'Цаг шинэчлэгдлээ':'Цаг нэмэгдлээ');resetForm();loadBookings()}catch(err){formError.textContent=err.message}}
function editBooking(id){let b=bookings.find(x=>x.id===id);if(!b)return;bookingId.value=b.id;artist.value=b.artist;service.value=b.service;date.value=b.booking_date;time.value=b.booking_time;customerName.value=b.customer_name||'';customerPhone.value=b.customer_phone||'';note.value=b.note||'';formTitle.textContent='Цаг засах';saveBtn.textContent='Өөрчлөлт хадгалах';cancelEdit.classList.remove('hidden');scrollTo({top:0,behavior:'smooth'})}
function resetForm(){bookingForm.reset();bookingId.value='';date.value=localDate(new Date());formTitle.textContent='Цаг гараар нэмэх';saveBtn.textContent='Цаг хадгалах';cancelEdit.classList.add('hidden');formError.textContent=''}
async function cancelBooking(id){if(!confirm('Энэ цагийг цуцлах уу?'))return;try{await api('DELETE',null,API+'?id='+encodeURIComponent(id));toast('Цаг цуцлагдлаа');loadBookings()}catch(e){toast(e.message)}}
function toast(t){notice.textContent=t;notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),2500)}setup();
</script></body></html>
